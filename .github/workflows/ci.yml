name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  lint-docs:
    name: Lint docs (fences, links, placeholders, catalog manifest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint markdown and validate catalog manifest
        run: node scripts/lint-docs.mjs

  trust-card-evidence:
    # Trust over speed: a PR that touches trust report cards must keep evidence.
    # Full adversarial evidence verification is a stub for now; see scripts/lint-docs.mjs check-evidence.
    name: Trust cards require evidence links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Detect modified trust cards
        id: cards
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${BASE_SHA:-$(git rev-parse HEAD^ 2>/dev/null || echo HEAD)}"
          files="$(git diff --name-only --diff-filter=ACMRTUXB "$base" HEAD -- 'docs/trust/*.md' | tr '\n' ' ' | sed 's/ *$//')"
          echo "Modified trust cards: ${files:-<none>}"
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check evidence links on modified trust cards
        if: steps.cards.outputs.files != ''
        env:
          CARDS: ${{ steps.cards.outputs.files }}
        run: node scripts/lint-docs.mjs check-evidence $CARDS

  test:
    name: TypeScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package_dir: [tools/scan, packages/dsh-bridge]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run tests where a package is wired up (graceful skip otherwise)
        run: |
          set +e
          found=0
          for dir in "${{ matrix.package_dir }}" .; do
            [ -f "$dir/package.json" ] || continue
            found=1
            echo "::group::tests in $dir"
            (
              cd "$dir" || exit 1
              if [ -f package-lock.json ]; then
                npm ci --ignore-scripts || exit 97
              elif [ -f pnpm-lock.yaml ]; then
                pnpm install --frozen-lockfile --ignore-scripts || exit 97
              else
                echo "no lockfile in $dir; skipping tests until one lands"
                exit 0
              fi
              if grep -q '"test"' package.json; then
                npm run test
              else
                echo "no test script in package.json yet, nothing to run"
              fi
            )
            status=$?
            if [ "$status" -eq 97 ]; then
              if [ "$dir" = "." ]; then
                echo "::error::pnpm install failed at repo root"
                exit 1
              fi
              echo "::warning::pnpm install failed in $dir; skipping tests until lockfile lands"
            elif [ "$status" -ne 0 ]; then
              exit "$status"
            fi
            echo "::endgroup::"
          done
          if [ "$found" != 1 ]; then
            echo "No package.json present yet; placeholder test step skipped gracefully."
          fi
